# Alembic configuration. The database URL is intentionally NOT set here — it is
# injected in alembic/env.py from the environment, because a password containing '%'
# would be mangled by ConfigParser interpolation if placed in this file.

[alembic]
script_location = %(here)s/alembic
# Revision filenames sort in apply order: <rev>_<slug>.py
file_template = %%(rev)s_%%(slug)s
# Make the application package importable when running from the repo root.
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
