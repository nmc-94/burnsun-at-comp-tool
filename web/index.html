<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Set the theme before first paint to avoid a flash. Values: light | dark | system.
      // Must stay in sync with src/theme.ts (same key and resolution rule).
      //
      // The prefix is substituted at build time from brand.storageKeyPrefix — see the
      // brand-storage-prefix plugin in vite.config.ts. This script runs before any module, so
      // it cannot import the config, and a literal here would drift the moment anyone
      // rebranded.
      (function () {
        var KEY = '__BRAND_STORAGE_PREFIX__.theme'
        var pref = 'system'
        try {
          var stored = localStorage.getItem(KEY)
          if (stored === 'light' || stored === 'dark' || stored === 'system') pref = stored
        } catch (e) {}
        var dark =
          pref === 'dark' ||
          (pref === 'system' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        var resolved = dark ? 'dark' : 'light'
        document.documentElement.dataset.theme = resolved
        document.documentElement.style.colorScheme = resolved
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Azeret+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>BurnSun · AT Comp Tool</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
