<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Dark first, matching the default below: this is what the browser renders form
         controls and scrollbars with in the instant before the script runs. -->
    <meta name="color-scheme" content="dark light" />
    <script>
      // Set the theme before first paint to avoid a flash. Values: light | dark | system.
      // Must stay in sync with src/theme.ts (same key, same default, same resolution rule).
      //
      // The prefix is substituted at build time from brand.storageKeyPrefix — see the
      // brand-storage-prefix plugin in vite.config.ts. This script runs before any module, so
      // it cannot import the config, and a literal here would drift the moment anyone
      // rebranded.
      (function () {
        var KEY = '__BRAND_STORAGE_PREFIX__.theme'
        // Dark unless something is stored. `system` is still resolved when a browser has it
        // stored, but it is no longer what an unset preference means.
        var pref = 'dark'
        try {
          var stored = localStorage.getItem(KEY)
          if (stored === 'light' || stored === 'dark' || stored === 'system') pref = stored
        } catch (e) {}
        var dark =
          pref === 'dark' ||
          (pref === 'system' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        // `data-theme` only — tokens.css declares `color-scheme` beside each palette, and the
        // stylesheet is render-blocking, so it is in force before anything paints. Setting it
        // inline here as well only shadowed those rules, which the sign-in screen needs to win.
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
    <script>
      // And the size, before first paint for the same reason and a louder one: this can draw the
      // whole application a quarter larger, so arriving at the default size and correcting once
      // the bundle has parsed is not a subtle flash but the entire page reflowing.
      //
      // Its own script element rather than a second function in the one above, so that neither
      // has to end in a semicolon to keep the other from being parsed as a call to it.
      //
      // Three things must stay in sync with the modules, because this runs before either exists:
      // src/settings.ts (the key, the two field names, the step names, the default), and
      // src/ui-scale.ts (the attribute, the media query below, and the numbers tokens.css
      // resolves the attribute to).
      (function () {
        var KEY = '__BRAND_STORAGE_PREFIX__.settings'
        try {
          // A JSON blob, where the theme is a bare string — so this parses, inside the same
          // shrug-and-default catch `readSettings` uses. A throw here is before anything has
          // rendered and would take the page down rather than merely arrive at the wrong size.
          var stored = JSON.parse(localStorage.getItem(KEY) || 'null')
          if (stored) {
            // Two sizes are remembered, one per window shape, and this picks the one belonging to
            // the window being opened. The *unscaled* window, deliberately — `onMobile` in
            // src/ui-scale.ts has why asking about the scaled layout width would chase itself.
            var mobile =
              window.matchMedia && window.matchMedia('(max-width: 860px)').matches
            var size = mobile ? stored.uiSizeMobile : stored.uiSizeDesktop
            // A browser that predates the two fields carried one boolean for both shapes. Same
            // fallback as `readSettings`, so a cold load and a warm one agree.
            if (size !== 'large' && size !== 'larger') {
              size = stored.largerUi === true ? 'larger' : 'normal'
            }
            // Anything else — absent, misspelt, a number — means the default, which is no
            // attribute at all.
            if (size === 'large' || size === 'larger') {
              document.documentElement.dataset.uiScale = size
            }
          }
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Azeret+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>BurnSun · AT Comp Tool</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
