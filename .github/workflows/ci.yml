name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: comptool
          POSTGRES_PASSWORD: comptool
          POSTGRES_DB: comptool
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U comptool -d comptool"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://comptool:comptool@localhost:5432/comptool
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: comptool
          POSTGRES_PASSWORD: comptool
          POSTGRES_DB: comptool
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U comptool -d comptool"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://comptool:comptool@localhost:5432/comptool
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install .
      - name: Apply migrations
        run: alembic -c alembic.ini upgrade head
      - name: Drift gate (models match migrations)
        run: alembic -c alembic.ini check
      # The deploy sequence, on the only install here that is not editable — so a bundled
      # payload missing from the wheel fails here rather than in a container. Run twice:
      # the entrypoint runs it on every start, so it has to be a no-op the second time.
      - name: Seed the bundled ruleset (and prove it is idempotent)
        run: |
          python -m comptool.ingest seed
          python -m comptool.ingest seed
