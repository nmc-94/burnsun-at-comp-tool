[project]
name = "comptool"
version = "0.1.0"
description = "EVE Alliance Tournament team-composition tool — single-service API that also serves the SPA."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "python-dotenv>=1.0",
    # Talking to EVE SSO and to public ESI. Sync and async, and already what FastAPI's
    # TestClient speaks, so the two halves of the stack share one HTTP client.
    "httpx>=0.27",
    # Verifying the SSO identity token against the published signing keys. 2.10 is the
    # first release whose decode() accepts a list of acceptable issuers, which EVE needs.
    "pyjwt>=2.10",
    # Signature verification for the above, and Fernet for the refresh token at rest.
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Only the application package is installable; alembic/, tests/, web/ are not packages.
packages = ["comptool", "comptool.auth", "comptool.ingest"]

[tool.setuptools.package-data]
# The codified ruleset ships inside the package: docs/ is excluded from the image, so a
# deployment seeds itself from this rather than from a file the operator has to supply.
comptool = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated migration files follow Alembic's own conventions; don't lint them.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# A small, stock rule set: pyflakes, pycodestyle, import sorting, pyupgrade, bugbear.
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# pytest puts the test directory on the path, so tests share constants through conftest;
# it belongs with our own imports, not with third-party ones.
known-first-party = ["conftest"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends/Query/... are calls-in-defaults by design; don't flag them (B008).
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header",
    "fastapi.Cookie", "fastapi.Body", "fastapi.Form", "fastapi.File", "fastapi.Security",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
